name: Build plugin

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet publish Jellyfin.Plugin.LibraryHealth -c Release -o out

      - name: Check the catalog files
        run: |
          python3 -m py_compile scripts/update_manifest.py
          python3 -m json.tool manifest.json >/dev/null


      - name: Package
        run: |
          mkdir -p dist
          cp out/Jellyfin.Plugin.LibraryHealth.dll dist/
          cd dist && zip -q ../jellyfin-plugin-library-health.zip Jellyfin.Plugin.LibraryHealth.dll

      - uses: actions/upload-artifact@v4
        with:
          name: jellyfin-plugin-library-health
          path: jellyfin-plugin-library-health.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" jellyfin-plugin-library-health.zip --clobber

      - name: Add the release to the plugin repository manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python3 scripts/update_manifest.py "$GITHUB_REF_NAME" jellyfin-plugin-library-health.zip \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/jellyfin-plugin-library-health.zip" \
            "See https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Add ${GITHUB_REF_NAME} to manifest.json"
          git push origin main
